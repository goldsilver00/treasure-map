<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่ล่าสมบัติมือสอง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f3f2ec; --panel:#fbfaf6; --ink:#1d2a2a; --muted:#5f6b69; --line:#d9d8cf;
  --gold:#b8860b; --gold-soft:#f3e6c4; --teal:#1f5c5a; --teal-soft:#dbe8e5;
  --ok:#2e7d4f; --ok-soft:#dcefe2; --bad:#b0413e; --bad-soft:#f5dedc;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141b1b; --panel:#1a2323; --ink:#e7ebe8; --muted:#9aa7a4; --line:#2c3837;
  --gold:#e0b14a; --gold-soft:#3a3120; --teal:#7fc3bd; --teal-soft:#20393a;
  --ok:#6cc58f; --ok-soft:#1d3426; --bad:#e58a86; --bad-soft:#3a2221; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
/* แผนที่อยู่กับที่ เลื่อนเฉพาะรายชื่อร้าน */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:minmax(0,1fr)}
#map{min-width:0;min-height:0;height:100%;background:var(--bg)}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line)}
header.top{flex:none}
header.top{padding:18px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:grid;gap:10px}
h1{font-family:var(--f-display);font-size:1.35rem;font-weight:700;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.progress{display:flex;align-items:center;gap:10px;font-size:.85rem}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--panel)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sync{font-size:.74rem;color:var(--muted)}
.list{overflow-y:auto;flex:1 1 auto;min-height:0;padding-bottom:24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.card{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.card:hover{background:var(--teal-soft)}
.card.sel{background:var(--gold-soft)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border:2px solid var(--gold);color:var(--ink)}
.card.top10 .num{background:var(--gold);color:#fff}
.card.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.body{min-width:0;display:grid;gap:5px}
.name{font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.3;margin:0}
.card.done .name{color:var(--muted)}
.meta{color:var(--muted);font-size:.82rem;margin:0}
.hours{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.84rem}
.st{font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st.open{background:var(--ok-soft);color:var(--ok)}
.st.closed{background:var(--bad-soft);color:var(--bad)}
.st.unk{background:var(--line);color:var(--muted)}
.target{font-size:.84rem;margin:0}
.target b{font-weight:600;color:var(--teal)}
.warn{font-size:.78rem;color:var(--muted);margin:0;font-style:italic}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:4px}
.btn{font:inherit;font-size:.82rem;font-weight:600;text-decoration:none;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:3px 12px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--teal);color:var(--panel)}
.tick{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;cursor:pointer;user-select:none;position:relative}
.tick input{position:absolute;opacity:0;pointer-events:none}
.tick span{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;transition:.15s}
.tick input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.tick input:checked+span{background:var(--ok);border-color:var(--ok)}
.tick input:checked+span::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.vdate{font-family:var(--f-mono);font-size:.74rem;color:var(--ok)}
/* map pins */
.pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--f-mono);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.top{background:#b8860b;color:#fff}
.pin.backup{background:#fff;color:#1d2a2a;border:3px solid #b8860b}
.pin.done{background:#2e7d4f;color:#fff;border-color:#fff}
.pin.sel{transform:scale(1.3)}
.pin.dim{opacity:.25}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px}
.legend{background:#fff;color:#1d2a2a;border-radius:10px;padding:8px 12px;font:12px var(--f-body);box-shadow:0 1px 5px rgba(0,0,0,.25);display:grid;gap:4px}
.legend div{display:flex;align-items:center;gap:7px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:40% minmax(0,1fr)}
  .side{border-left:0;border-top:1px solid var(--line)}
  header.top{padding-top:12px;gap:8px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      </div>
      <div class="progress"><div class="bar"><i id="bar"></i></div><span class="count" id="count">0/20 ไปแล้ว</span></div>
      <div class="filters" role="group" aria-label="ตัวกรอง">

</div>

/* ---------- ที่เก็บข้อมูล: Apps Script (ซิงก์ทุกเครื่อง) หรือ localStorage (GitHub Pages) ---------- */
const GAS = typeof google!=="undefined" && google.script && google.script.run;
const LS="treasure-visited";
let visited={};
const syncEl=document.getElementById("sync");
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(visited))}catch(e){}}
function store(){
  return {
    load(){
      if(!GAS){visited=loadLocal();syncEl.textContent="สถานะที่ติ๊กเก็บไว้ในเบราว์เซอร์นี้";render();return}
      google.script.run
        .withSuccessHandler(v=>{visited=v||{};syncEl.textContent="สถานะที่ติ๊กซิงก์กับทุกเครื่องที่เปิดเว็บแอปนี้";render()})
        .withFailureHandler(()=>{visited=loadLocal();syncEl.textContent="โหลดจาก Google ไม่ได้ ใช้ข้อมูลในเบราว์เซอร์นี้แทน";render()})
        .getVisited();
    },
    toggle(id,on){
      if(on) visited[id]={at:new Date().toISOString()}; else delete visited[id];
      saveLocal(); render();
      if(!GAS) return;
      syncEl.textContent="กำลังบันทึก…";
      google.script.run
        .withSuccessHandler(v=>{visited=v||{};syncEl.textContent="บันทึกแล้ว";render()})
        .withFailureHandler(()=>{syncEl.textContent="บันทึกขึ้น Google ไม่สำเร็จ ลองติ๊กใหม่อีกครั้ง"})
        .setVisited(id,on);
    }
  };
}
const S=store();

/* ---------- เวลาไทย ---------- */
function bkkNow(){const d=new Date(Date.now()+7*3600e3);return {day:d.getUTCDay(),min:d.getUTCHours()*60+d.getUTCMinutes()}}
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
function openState(p){
  if(!p.s) return "unk";
  const {day,min}=bkkNow();
  for(const [days,o,c] of p.s) if(days.includes(day)&&min>=toMin(o)&&min<toMin(c)) return "open";
  return "closed";
}
const stLabel={open:"เปิดอยู่",closed:"ปิดอยู่",unk:"ยังไม่ทราบเวลา"};

/* ---------- แผนที่ ---------- */
const map=L.map("map",{zoomControl:true}).setView([13.8,100.52],10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const legend=L.control({position:"bottomleft"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML='<div><span class="dot" style="background:#b8860b"></span>10 แห่งที่ควรไปก่อน</div><div><span class="dot" style="background:#fff;border:3px solid #b8860b"></span>จุดสำรอง</div><div><span class="dot" style="background:#2e7d4f"></span>ไปแล้ว</div><div style="color:#5f6b69">ตำแหน่งหมุดโดยประมาณ</div>';return d};
legend.addTo(map);
const markers={};
for(const p of P){
  const m=L.marker([p.lat,p.lng],{title:p.name}).addTo(map);
  m.on("click",()=>select(p.id,true));
  markers[p.id]=m;
}
map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lng])),{padding:[30,30]});
function updatePins(vis){
  for(const p of P){
    const cls=["pin",visited[p.id]?"done":(p.top?"top":"backup")];
    if(!vis.has(p.id))cls.push("dim");
    if(p.id===selected)cls.push("sel");
    markers[p.id].setIcon(L.divIcon({className:"",html:`<div class="${cls.join(" ")}">${p.n}</div>`,iconSize:[28,28],iconAnchor:[14,14]}));
    markers[p.id].setZIndexOffset(p.id===selected?1000:0);
  }
}

/* ---------- รายการ ---------- */
let group="all",fOpen=false,fTodo=false,fDone=false,selected=null;
const list=document.getElementById("list");
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit",timeZone:"Asia/Bangkok"})}catch(e){return ""}};
function visibleSet(){
  const s=new Set();
  for(const p of P){
    if(group==="top"&&!p.top)continue; if(group==="backup"&&p.top)continue;
    if(fOpen&&openState(p)!=="open")continue;
    if(fTodo&&visited[p.id])continue; if(fDone&&!visited[p.id])continue;
    s.add(p.id);
  }
  return s;
}
function render(){
  const vis=visibleSet();
  const n=P.filter(p=>visited[p.id]).length;
  document.getElementById("count").textContent=`${n}/20 ไปแล้ว`;
  document.getElementById("bar").style.width=(n/20*100)+"%";
  list.innerHTML="";
  const items=P.filter(p=>vis.has(p.id));
  if(!items.length) list.innerHTML='<div class="empty">ไม่มีสถานที่ตรงกับตัวกรองนี้ ลองกด “ทั้งหมด” หรือปิดตัวกรองเวลา</div>';
  for(const p of items){ try{
    const st=openState(p),v=visited[p.id];
    const c=document.createElement("article");
    c.className="card"+(p.top?" top10":"")+(v?" done":"")+(p.id===selected?" sel":"");
    c.id="card-"+p.id;
    c.innerHTML=`<div class="num">${p.n}</div>
      <div class="body">
        <h2 class="name"></h2>
        <p class="meta ar"></p>
        <div class="hours"><span class="st ${st}">${stLabel[st]}</span><span class="htxt"></span></div>
        <p class="target"><b>เป้าหมาย:</b> <span class="tt"></span></p>
        ${p.note?'<p class="meta nt"></p>':""}
        ${p.warn?'<p class="warn"></p>':""}
        <div class="actions">
          <label class="tick"><input type="checkbox" id="chk-${p.id}" ${v?"checked":""}><span></span>ไปแล้ว</label>
          ${v&&v.at?`<span class="vdate">${fmtDate(v.at)}</span>`:""}
          <button type="button" class="btn nav">📍 นำทาง</button>
        </div>
      </div>`;
    c.querySelector(".name").textContent=p.name;
    c.querySelector(".ar").textContent=p.area;
    c.querySelector(".htxt").textContent=p.h||"ยังหาเวลาทำการที่ยืนยันได้ไม่เจอ ดูในเพจร้านก่อนไป";
    c.querySelector(".tt").textContent=p.t;
    if(p.note)c.querySelector(".nt").textContent=p.note;
    if(p.warn)c.querySelector(".warn").textContent=p.warn;
    const nav=c.querySelector(".nav");
    if(nav) nav.addEventListener("click",e=>{e.stopPropagation();openMaps(p)});
    c.addEventListener("click",e=>{if(e.target.closest("a,label,input,button"))return;select(p.id,false)});
    c.querySelector("input").addEventListener("change",e=>S.toggle(p.id,e.target.checked));
    list.appendChild(c);
  }catch(err){console.error(p.id,err);syncEl.textContent="แสดงรายการไม่ครบ: "+err.message} }
  updatePins(vis);
}
function openMaps(p){
  const u="https://www.google.com/maps/search/?"+new URLSearchParams({api:"1",query:p.name+" "+p.area}).toString();
  const w=window.open(u,"_blank");
  if(!w){try{window.top.location.href=u}catch(e){location.href=u}}
}
function select(id,fromMap){
  selected=(selected===id&&!fromMap)?null:id;
  render();
  if(!selected) return;
  const p=P.find(x=>x.id===id);
  if(fromMap){const c=document.getElementById("card-"+id);c&&c.scrollIntoView({behavior:"smooth",block:"nearest"})}
  else map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),13),{duration:.6});
}

/* ---------- ตัวกรอง ---------- */
document.querySelectorAll(".chip[data-g]").forEach(b=>b.onclick=()=>{group=b.dataset.g;document.querySelectorAll(".chip[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
const fo=document.getElementById("fOpen"),ft=document.getElementById("fTodo"),fd=document.getElementById("fDone");
fo.onclick=()=>{fOpen=!fOpen;fo.setAttribute("aria-pressed",fOpen);render()};
ft.onclick=()=>{fTodo=!fTodo;if(fTodo){fDone=false;fd.setAttribute("aria-pressed",false)}ft.setAttribute("aria-pressed",fTodo);render()};
fd.onclick=()=>{fDone=!fDone;if(fDone){fTodo=false;ft.setAttribute("aria-pressed",false)}fd.setAttribute("aria-pressed",fDone);render()};

render();
S.load();
setInterval(render,60000);
</script>
</body>
</html>
